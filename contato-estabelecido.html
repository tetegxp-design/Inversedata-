<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>CONTATO ESTABELECIDO</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at center, #4b0000, #120000);
    font-family: "Courier New", monospace;
    color: #f5eaea;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

#overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.2);
    pointer-events: none;
}

#container {
    max-width: 820px;
    padding: 40px;
    text-align: center;
    z-index: 2;
}

#text {
    font-size: 20px;
    line-height: 2;
    letter-spacing: 0.6px;
    text-shadow: 0 0 10px rgba(180,0,0,0.6);
    min-height: 260px;
}

.glitch {
    animation: glitch 0.2s infinite;
}

@keyframes glitch {
    0% { text-shadow: 2px 0 red; }
    50% { text-shadow: -2px 0 darkred; }
    100% { text-shadow: 2px 0 red; }
}

#blood {
    position: absolute;
    top: -100%;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, rgba(120,0,0,0.9), #5a0000);
    animation: drip 6s forwards;
    display: none;
    z-index: 3;
}

@keyframes drip {
    to { top: 0; }
}

#error {
    position: absolute;
    bottom: 40px;
    width: 100%;
    text-align: center;
    font-size: 14px;
    color: #ffb3b3;
    opacity: 0;
}
</style>
</head>

<body>

<div id="blood"></div>
<div id="overlay"></div>

<div id="container">
    <div id="text"></div>
</div>

<div id="error">ERRO FATAL — conexão perdida</div>

<script>
const textEl = document.getElementById("text");
const blood = document.getElementById("blood");
const error = document.getElementById("error");

const lines = [
    "[SISTEMA] contato estabelecido.",
    "[SISTEMA] acesso não autorizado detectado.",
    "",
    "Você não percebeu quando aconteceu.",
    "Mas aconteceu.",
    "",
    "Havia escolhas.",
    "Sempre há.",
    "E você escolheu continuar.",
    "",
    "Alguém ficou para trás.",
    "Não porque precisava.",
    "Mas porque era mais fácil.",
    "",
    "É assim que funciona.",
    "Você segue.",
    "Outro paga.",
    "",
    "Você chama isso de sobrevivência.",
    "O sistema chama de sacrifício.",
    "",
    "Não há caminho limpo.",
    "Só caminhos que você aprende a justificar.",
    "",
    "Agora isso vive com você.",
    "Mesmo que finja não ouvir.",
    "",
    "[SISTEMA] registro permanente criado."
];

let l = 0;
let c = 0;

function typeLine() {
    if (l >= lines.length) {
        endSequence();
        return;
    }

    const current = lines[l];

    if (c < current.length) {
        textEl.innerHTML += current.charAt(c);
        c++;
        setTimeout(typeLine, 45);
    } else {
        textEl.innerHTML += "<br><br>";
        c = 0;
        l++;
        setTimeout(typeLine, 900);
    }
}

function endSequence() {
    setTimeout(() => {
        textEl.classList.add("glitch");
    }, 1000);

    setTimeout(() => {
        blood.style.display = "block";
    }, 2500);

    setTimeout(() => {
        error.style.opacity = 1;
    }, 5000);
}

typeLine();
</script>

</body>
</html>
