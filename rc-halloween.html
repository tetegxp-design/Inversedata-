<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>R&C — Iniciação de Halloween</title>
<link rel="icon" href="data:;base64,iVBORw0KGgo=">
<style>
  /* Visual terminal / glitch */
  :root{--bg:#040406;--fg:#dffbf3;--accent:#9ef3d8;--danger:#ff6b6b;}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(ellipse at top,#081018 0%,var(--bg) 40%),#000;font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Courier New", monospace;color:var(--fg);height:100vh;display:flex;align-items:center;justify-content:center}
  .screen{width:min(980px,94vw);background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(0,0,0,0.15));padding:28px;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.03)}
  .header{display:flex;align-items:center;gap:12px}
  .logo{width:56px;height:56px;border-radius:8px;background:linear-gradient(135deg,#072,#045);display:flex;align-items:center;justify-content:center;color:#002;font-weight:800}
  h1{margin:0;font-size:18px;letter-spacing:0.6px}
  .sub{color:rgba(223,251,243,0.6);font-size:13px;margin-top:6px}
  .terminal{background:#020406;border-radius:8px;padding:18px;margin-top:18px;min-height:260px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.02)}
  .line{font-family:monospace;font-size:15px;line-height:1.6;white-space:pre-wrap}
  .prompt{color:var(--accent)}
  .cursor{display:inline-block;background:var(--accent);width:8px;height:14px;margin-left:6px;vertical-align:middle;animation:blink .9s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .glitch{
    position:relative; display:inline-block;
  }
  .glitch::before,.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;mix-blend-mode:screen;opacity:.6}
  .glitch::before{transform:translate(2px, -1px);color:#8ff7e0;clip-path:polygon(0 0,100% 0,100% 50%,0 50%)}
  .glitch::after{transform:translate(-2px, 1px);color:#89f0c8;clip-path:polygon(0 50%,100% 50%,100% 100%,0 100%)}
  .cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  button{background:transparent;border:1px solid rgba(158,243,216,0.14);color:var(--accent);padding:8px 12px;border-radius:8px;cursor:pointer}
  button.cta-join{background:var(--accent);color:#001;border:1px solid rgba(0,0,0,0.12)}
  .small{color:rgba(223,251,243,0.45);font-size:13px;margin-top:12px}
  input.name{background:#000;border:1px dashed rgba(158,243,216,0.12);color:var(--fg);padding:8px;border-radius:6px;font-family:monospace}
  footer{margin-top:18px;color:rgba(223,251,243,0.12);font-size:12px;text-align:right}

  /* cinematic reveal effects */
  .glow{filter:drop-shadow(0 6px 30px rgba(110,240,214,0.06))}
  @media (max-width:520px){.screen{padding:16px}.terminal{min-height:220px}.line{font-size:14px}}
</style>
</head>
<body>
  <div class="screen glow" role="main" aria-live="polite">
    <div class="header">
      <div class="logo">R&C</div>
      <div>
        <h1>R&C — Iniciação: Halloween</h1>
        <div class="sub">Termo de ativação: <span style="color:var(--accent)">SPECTER</span> — Acesso experimental</div>
      </div>
    </div>

    <div class="terminal" id="terminal" aria-hidden="false">
      <div class="line prompt">[system@rc] iniciando sessão segura...</div>
      <div class="line prompt" id="typed"></div>
      <div class="line prompt" id="typed2"></div>
      <div style="height:8px"></div>
      <div id="inputArea" style="display:flex;gap:8px;align-items:center">
        <label class="small" for="name">Identificador (opcional):</label>
        <input id="name" class="name" placeholder="Digite seu nome..." />
        <button id="goBtn">INVOCAR</button>
        <button class="cta-join" id="joinBtn" style="display:none">ENTRAR NO R&C</button>
      </div>

      <div class="small" id="hint" style="display:none">
        <p>Pressione <strong>ENTRAR</strong> para aceitar o chamado. Se não participar, o eco permanece.</p>
      </div>
    </div>

    <div class="cta" id="ctaSpace" style="display:none">
      <button id="replay">REJOGAR</button>
      <button id="share">COPIAR TEASER</button>
      <button id="more">VER DETALHES</button>
    </div>

    <footer>R&C • Evento de Halloween • 31 de Outubro • 22:00 (horário do servidor)</footer>
  </div>

<script>
/* Texto dinâmico — não precisa editar */
const seq = [
  "[system@rc] autenticação parcial detectada...",
  "[kernel] mapeando ecos em 3... 2... 1...",
  "access: R&C\\HALLOWEEN\\SPECTER",
  "implanting: ceremonial prompt...",
  "preparing: transference — protocolo iniciado.",
  ">>>",
  "Anomalia: presença sensorial identificada.",
  "Cadeia: abrirá apenas para quem responder.",
  "Escreva seu nome e pressione INVOCAR para prosseguir.",
];

const typedEl = document.getElementById('typed');
const typedEl2 = document.getElementById('typed2');
const terminal = document.getElementById('terminal');
const nameIn = document.getElementById('name');
const goBtn = document.getElementById('goBtn');
const joinBtn = document.getElementById('joinBtn');
const ctaSpace = document.getElementById('ctaSpace');
const replay = document.getElementById('replay');
const share = document.getElementById('share');
const more = document.getElementById('more');

let idx=0;
function typeLine(text, target, speed=20, cb){
  target.textContent = "";
  let i=0;
  const t = setInterval(()=> {
    target.textContent += text[i] || "";
    i++;
    if(i >= text.length){ clearInterval(t); cb && cb(); }
  }, speed);
}

// initial autoplay of lines
function runIntro(i=0){
  if(i>=seq.length){ typedEl2.textContent=""; document.getElementById('inputArea').style.display='flex'; return; }
  typeLine(seq[i], i<4?typedEl:typedEl2, 25, ()=> {
    setTimeout(()=> runIntro(i+1), 380);
  });
}
runIntro();

// button actions
goBtn.addEventListener('click', ()=> {
  const who = (nameIn.value||'CONVIDADO').trim();
  // lock input, play reveal
  nameIn.disabled = true; goBtn.disabled = true;
  typedEl.textContent = `[system@rc] registrando: ${who}`;
  setTimeout(()=> {
    typedEl2.textContent = "Conexão: ║▓▒░ iniciada ║▓▒░";
    setTimeout(()=> {
      typedEl.textContent = `Olá, ${who}. A noite te chama.`;
      typedEl2.textContent = "Prepare-se — Iniciação às 22:00";
      // show join button and CTAs
      joinBtn.style.display = 'inline-block';
      document.getElementById('hint').style.display = 'block';
      ctaSpace.style.display = 'flex';
    }, 1000);
  }, 600);
});

// join button (replace link with your server invite)
joinBtn.addEventListener('click', ()=> {
  window.open('https://discord.gg/INSIRA_SEU_LINK_AQUI', '_blank');
});

// replay and share
replay.addEventListener('click', ()=> { location.reload(); });
share.addEventListener('click', ()=> {
  const teaser = `R&C — Iniciação de Halloween\n31/10 • 22:00\nEntre e descubra: https://SEU_LINK_AQUI`;
  navigator.clipboard?.writeText(teaser).then(()=> alert('Teaser copiado!'));
});
more.addEventListener('click', ()=> {
  alert('Evento: Iniciação de Halloween — Ritual interativo. Prepare-se para enigmas, roleplay e surpresas.\n\nData: 31/10 às 22:00 (horário do servidor)\nLocal: Canal principal do servidor R&C');
});

// small UX: allow enter key to invoke
nameIn.addEventListener('keyup', (e)=> { if(e.key === 'Enter') goBtn.click(); });
</script>
</body>
</html>
