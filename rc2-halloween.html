<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>R&C — Iniciação de Halloween</title>
<link rel="icon" href="data:;base64,iVBORw0KGgo=">
<style>
  :root{--bg:#040406;--fg:#dffbf3;--accent:#9ef3d8;--danger:#ff6b6b;}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(ellipse at top,#081018 0%,var(--bg) 40%),#000;font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Courier New", monospace;color:var(--fg);height:100vh;display:flex;align-items:center;justify-content:center}
  .screen{width:min(1100px,96vw);background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(0,0,0,0.15));padding:28px;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.03)}
  .header{display:flex;align-items:center;gap:12px}
  .logo{width:64px;height:64px;border-radius:10px;background:linear-gradient(135deg,#072,#045);display:flex;align-items:center;justify-content:center;color:#002;font-weight:800;font-family:"Courier New",monospace}
  h1{margin:0;font-size:20px;letter-spacing:0.6px}
  .sub{color:rgba(223,251,243,0.6);font-size:13px;margin-top:6px}
  .terminal{background:#020406;border-radius:10px;padding:20px;margin-top:18px;min-height:380px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.02);overflow:hidden;position:relative}
  .line{font-family:monospace;font-size:15px;line-height:1.6;white-space:pre-wrap;color:var(--fg)}
  .prompt{color:var(--accent)}
  .cursor{display:inline-block;background:var(--accent);width:8px;height:18px;margin-left:6px;vertical-align:middle;animation:blink .9s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
  button, .btn {
    background:transparent;border:1px solid rgba(158,243,216,0.14);color:var(--accent);padding:8px 12px;border-radius:8px;cursor:pointer;
  }
  button.cta-join{background:var(--accent);color:#001;border:1px solid rgba(0,0,0,0.12)}
  .small{color:rgba(223,251,243,0.45);font-size:13px;margin-top:12px}
  input.name{background:#000;border:1px dashed rgba(158,243,216,0.12);color:var(--fg);padding:10px;border-radius:8px;font-family:monospace}
  .bigtext{margin-top:18px;text-align:left;max-height:260px;overflow:auto;padding:12px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(0,0,0,0.06));border-radius:8px;border:1px solid rgba(255,255,255,0.02)}
  .glow{filter:drop-shadow(0 6px 30px rgba(110,240,214,0.06))}
  .muted{color:#6e8b8b;font-size:13px;margin-top:10px}
  .skip{margin-left:8px;border-style:dashed}
  .meta{position:absolute;right:18px;top:18px;color:rgba(223,251,243,0.08);font-size:11px;font-family:monospace}
  @media (max-width:820px){ .terminal{min-height:300px} .bigtext{max-height:220px} .logo{display:none} }
</style>
</head>
<body>
  <div class="screen glow" role="main" aria-live="polite">
    <div class="header">
      <div class="logo">R&C</div>
      <div style="flex:1">
        <h1>R&C — Ritual de Iniciação (Halloween)</h1>
        <div class="sub">Digite seu identificador. A noite escreverá pra você.</div>
      </div>
      <div class="meta">R&C • 31/10 • 22:00</div>
    </div>

    <div class="terminal" id="terminal" aria-hidden="false">
      <div class="line prompt">[system@rc] sessão segura iniciada...</div>

      <div style="display:flex;gap:10px;align-items:center;margin-top:14px">
        <label class="small" for="name">Identificador (opcional)</label>
        <input id="name" class="name" placeholder="Digite seu nome..." />
        <button id="goBtn">INVOCAR</button>
        <button id="skipBtn" class="btn skip" style="display:none">PULAR TEXTO</button>
      </div>

      <div class="bigtext" id="output" aria-live="polite" style="margin-top:18px">
        <div id="typedArea" class="line" style="min-height:160px"></div>
      </div>

      <div class="controls" id="controls" style="display:none">
        <button id="replay">REJOGAR</button>
        <button id="share">COPIAR TEASER</button>
        <button id="joinBtn" class="cta-join">ENTRAR NO R&C</button>
      </div>

      <div class="muted" id="mutedNote" style="display:none">Dica: se quiser interromper a escrita, pressione <strong>PULAR TEXTO</strong>.</div>
    </div>

  </div>

<script>
const monologues = [
`{{name}}, você chegou tarde.
A noite guarda devaneios antigos, rotos como papel queimado.
Ouço passos que já foram seus — ecos de outra vida.
Se fechar os olhos agora, vai lembrar de um lugar que não existe mais.
Não há retorno para quem responde ao chamado. Apenas escolhas que se repetem.
Fique atento ao relógio. Às 22:00, você será chamado novamente.
Se optar por ficar, aceite o silêncio que cresce. Se escolher sair, a porta se fecha sozinha.`,

`Eles disseram que era apenas uma brincadeira.
Mas quando te screenearam, encontraram marcas: símbolos tatuados nas margens da memória.
{{name}}, a troca já começou. Alguém leu seu nome num livro que não existe.
Há uma sala com espelhos que devolvem rostos que você nunca teve.
Não confie no primeiro reflexo. Não confie nas datas que piscam no canto.
A noite promete algo — e ela sempre cobra.`,

`O servidor respirou fundo e sussurrou seu nome: {{name}}.
As contas foram alinhadas, e as teclas digitam em seu lugar.
Há um registro antigo: "Não permita que os ecos se encontrem."
Mas você já está aqui. Já escutou o som que não deveria existir.
A iniciação é uma pergunta sem resposta; a pergunta se alimenta de quem responde.
Respire. Deixe o som passar. Depois decida.`,

`Quando as velas caem, o código permanece.
{{name}}, somos poucos os que viram a sombra do protocolo.
Eles acreditam que escrever memória é apenas um jogo — mas a escrita molda o real.
Se aceitar, a porta se abrirá somente para você.
Se recusar, restará a dúvida — e dúvidas são sementes.`];

const nameInput = document.getElementById('name');
const goBtn = document.getElementById('goBtn');
const typedArea = document.getElementById('typedArea');
const skipBtn = document.getElementById('skipBtn');
const controls = document.getElementById('controls');
const replay = document.getElementById('replay');
const share = document.getElementById('share');
const joinBtn = document.getElementById('joinBtn');
const mutedNote = document.getElementById('mutedNote');

let typingInterval = null;
let currentText = "";
let currentIdx = 0;
let playing = false;

function chooseMonologue(name){
  const raw = monologues[Math.floor(Math.random()*monologues.length)];
  return raw.replace(/\{\{name\}\}/g, name || "CONVIDADO");
}

function typeOut(text){
  typedArea.textContent = "";
  currentText = text;
  currentIdx = 0;
  playing = true;
  skipBtn.style.display = 'inline-block';
  mutedNote.style.display = 'block';

  typingInterval = setInterval(()=> {
    if(Math.random() < 0.03){
      typedArea.textContent += String.fromCharCode(0x2588);
    }
    typedArea.textContent += currentText[currentIdx] || "";
    currentIdx++;
    typedArea.parentElement.scrollTop = typedArea.parentElement.scrollHeight;
    if(currentIdx >= currentText.length){
      clearInterval(typingInterval);
      playing = false;
      skipBtn.style.display = 'none';
      controls.style.display = 'flex';
      mutedNote.style.display = 'none';
    }
  }, 28 + Math.floor(Math.random()*40));
}

function fastForward(){
  if(!playing) return;
  clearInterval(typingInterval);
  typedArea.textContent = currentText;
  playing = false;
  skipBtn.style.display = 'none';
  controls.style.display = 'flex';
  mutedNote.style.display = 'none';
}

goBtn.addEventListener('click', ()=> {
  const who = (nameInput.value||'CONVIDADO').trim();
  nameInput.disabled = true;
  goBtn.disabled = true;
  typedArea.textContent = "[system] registrando identificação...";
  setTimeout(()=> {
    const mono = chooseMonologue(who);
    typedArea.textContent = "";
    typeOut(mono);
  }, 700);
});

skipBtn.addEventListener('click', fastForward);

replay.addEventListener('click', ()=> {
  typedArea.textContent = "";
  nameInput.disabled = false;
  goBtn.disabled = false;
  controls.style.display = 'none';
  skipBtn.style.display = 'none';
  mutedNote.style.display = 'none';
  nameInput.value = "";
});

share.addEventListener('click', ()=> {
  const teaser = `R&C — Iniciação de Halloween\n31/10 • 22:00\nVenha se calar. https://tetegxp-design.github.io/Inversedata-/rc-halloween.html`;
  navigator.clipboard?.writeText(teaser).then(()=> alert('Teaser copiado!'));
});

joinBtn.addEventListener('click', ()=> {
  window.open('https://discord.gg/vVVnwGrJ', '_blank');
});

nameInput.addEventListener('keyup', (e)=> { if(e.key === 'Enter') goBtn.click(); });
</script>
</body>
</html>
